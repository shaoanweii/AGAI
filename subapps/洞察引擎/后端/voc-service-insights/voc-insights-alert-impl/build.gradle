apply plugin: 'java-library'

group = 'voc-insights-alert-impl'

dependencies {
    testImplementation  project(':voc-service-common').sourceSets.test.output
    api project(':voc-service-common')
    api project(':voc-service-components:voc-cmps-mybatis')
    api project(':voc-service-components:voc-cmps-redis')
    //api project(':voc-service-components:voc-cmps-swagger')
//    api project(':voc-service-components:voc-cmps-minio')
    api project(':voc-service-insights:voc-insights-api')
    api project(':voc-service-insights:voc-insights-common')
    api project(':voc-service-security:voc-security-client')
    api project(':voc-service-bizlogs:voc-bizlogs-api')
    api project(':voc-service-security:voc-security-api')
    api project(':voc-service-config')
    api project(':voc-service-third:voc-trhird-api')

    compileOnlyApi project(':voc-service-insights:voc-insights-impl')
    compileOnlyApi project(':voc-service-insights:voc-insights-data-impl')

    compileOnly('org.springframework.boot:spring-boot-starter-web')
    api('org.springframework.cloud:spring-cloud-starter-bootstrap')
    api ("com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery")
    api ("com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config")
    api('com.github.pagehelper:pagehelper-spring-boot-starter')
    api('org.springframework.boot:spring-boot-starter-validation')
}
