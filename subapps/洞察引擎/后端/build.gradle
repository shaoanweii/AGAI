    set('jacksonCoreVersion', "2.20.0") // 修复Jackson-core漏洞（2.11.3/2.12.2）
    set('snakeyamlVersion', "2.5") // 修复SnakeYAML远程代码执行（1.23/1.30/1.33）
    set('parquetAvroVersion', "1.15.2") // 修复Parquet-Avro任意代码执行（1.13.1）
    set('okioVersion', "3.6.0") // 修复Okio拒绝服务（1.6.0/1.17.2）
    set('commonsCompressVersion', "1.28.0") // 修复Commons-Compress无限循环（1.21/1.24.0）
