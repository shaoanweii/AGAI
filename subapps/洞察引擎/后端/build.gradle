            implementation ('com.fasterxml.jackson.core:jackson-databind:2.17.3')
            implementation ('com.fasterxml.jackson.core:jackson-core:2.17.3')
            implementation ('com.fasterxml.jackson.core:jackson-annotations:2.17.3')
            implementation ('com.alibaba.nacos:nacos-client:2.3.0')
            implementation ('com.alibaba.nacos:nacos-common:2.3.0')
            implementation ("org.apache.tomcat.embed:tomcat-embed-core:${tomcatEmbedVersion}")
            implementation ('org.bouncycastle:bcprov-jdk18on:1.78') // 注：ext中已定义1.78，此处需改为${bcprovjdk15onVersion}
            implementation ('com.mysql:mysql-connector-j:9.4.0')
            implementation ("org.apache.avro:avro:${avroVersion}")
            implementation ("com.squareup.retrofit2:converter-jackson:3.0.0")
            implementation "com.squareup.retrofit2:adapter-java8:3.0.0"
            implementation ("com.squareup.okhttp3:okhttp:4.12.0")
            implementation ("org.springframework.boot:spring-boot-starter-test:3.5.11")
            implementation ("org.springframework.boot:spring-boot-starter:3.3.13")
            implementation ("org.yaml:snakeyaml:2.5")
            implementation 'commons-io:commons-io:2.16.1'
            implementation "com.google.guava:guava:${guavaVersion}"
            implementation "org.gitlab4j:gitlab4j-api:6.4.0"
            implementation "org.springframework:spring-webmvc:6.1.21"
            implementation "org.springframework:spring-webflux:6.1.21"
            implementation "org.springframework:spring-web:6.1.21"
            implementation "org.springframework:spring-core:6.1.21"
            implementation "org.springframework.boot:spring-boot-autoconfigure:3.1.5"
            implementation ("org.springframework.cloud:spring-cloud-config-server:5.0.2")
            implementation "org.eclipse.jgit:org.eclipse.jgit:7.4.0.202509020913-r"
            implementation "org.springframework.security:spring-security-rsa:1.1.5"
            implementation "org.cryptacular:cryptacular:1.2.7"
            implementation "org.springframework.cloud:spring-boot-starter-webflux:3.3.13"
            implementation "org.springframework.cloud:spring-boot-starter-web:3.3.13"
//            implementation "com.alibaba.cloud:spring-alibaba-nacos-config:2023.0.0.0-RC1"
//            implementation "com.alibaba.cloud:spring-cloud-alibaba-commons:2023.0.0.0-RC1"
        }
    }

    compileJava {
    }


    test {
        enabled = false

        useTestNG()

        jvmArgs '--add-opens', '-Dspring.profiles.active=local','java.base/java.lang=ALL-UNNAMED'

        systemProperty 'file.encoding', 'UTF-8'
        include(["**/*Tests.class", "**/*Test.class"])
        testLogging.showStandardStreams = true

    }



    task clearJar(type: Delete) {
        delete "$buildDir/libs/lib"
    }

    task clearVocJar(type: Delete) {
        delete "$buildDir/libs/lib-voc"
    }

    // 将依赖包复制到lib目录
    task copyAllJar(type: Copy, dependsOn: 'clearJar') {
        from configurations.runtimeClasspath
        into "$buildDir/libs/lib"
        exclude("voc-*.jar")

        dependsOn jar
    }

    // 将依赖包复制到lib目录
    task copyVocJar(type: Copy, dependsOn: 'clearVocJar') {
        from configurations.runtimeClasspath
        into "$buildDir/libs/lib-voc"
        include("voc-*.jar")

        dependsOn jar
    }

    jar { enabled = true }

    project.afterEvaluate {
        copyAllJar.doFirst {
            copy {
                from configurations.runtimeClasspath
                into "$buildDir/libs/lib-voc"
                include("voc-*.jar")
            }
        }

        jar.doFirst {
            copy {
                delete "$buildDir/libs/logback-spring.xml"
                delete "$buildDir/libs/start.sh"

                from "$buildDir/../src/main/resources/dev_start"
                into "$buildDir/libs/"
                include("logback-spring.xml","start.sh")
            }


        }
    }
}

// 只为根项目禁用Spring Boot插件的bootJar任务
if (project == rootProject) {
    bootJar {
        enabled = false
    }
}

test {
    enabled = false
}
