    set('azureIdentityVersion', "1.18.1") // 修复Azure Identity权限提升（1.10.1）
    set('jsonPathVersion', "2.9.0") // 修复JsonPath堆栈溢出（2.8.0）
    set('guavaVersion', "33.3.1-jre") // 修复Guava临时目录权限（30.1-jre/31.0.1-jre）
    set('avroVersion', "1.11.4") // 修复Avro Schema解析漏洞（配合Parquet）
    set('bcprovVersion', "1.78") // 修复BouncyCastle CPU耗尽（1.64/1.70）
    set('woodstoxVersion', "7.0.0") // 修复Woodstox SSRF（6.2.6，若需保留则升级）

}


allprojects { // 所有模块/项目的配置
    group = 'com.voc'
    version = '2.0.0'

    repositories {
        // 明确指定仓库顺序，优先使用可访问的远程仓库
        mavenCentral()
        // 阿里云公共仓库
        maven {
            url 'https://maven.aliyun.com/repository/public'
        }
        // 阿里云Spring仓库
        maven {
            url 'https://maven.aliyun.com/repository/spring'
        }
        // Spring官方仓库
        maven {
            url 'https://repo.spring.io/release'
        }
        maven {
            url 'https://repo.spring.io/milestone'
        }
        maven {
            url 'https://repo.spring.io/snapshot'
        }
        // 本地Maven仓库
        mavenLocal()
        // 其他可能的仓库
        maven {
            url 'https://jcenter.bintray.com/'
        }
        // 添加Sonatype snapshots仓库，可能包含所需的依赖
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }
    }

    //业务编码字符集,注意这是指定源码解码的字符集[编译器]
    compileJava.options.encoding "UTF-8"
    //测试编码字符集,注意这是指定源码解码的字符集[编译器]
    compileTestJava.options.encoding "UTF-8"
    //编译JAVA文件时采用UTF-8:注意这是指定源码编码的字符集【源文件】
    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }
    //编译JAVA文件时采用UTF-8:注意这是指定文档编码的字符集【源文件】
    tasks.withType(Javadoc) {
        options.encoding = "UTF-8"
    }

    configurations.configureEach {
        resolutionStrategy {
            // Jackson 系列
            force "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
            force "com.fasterxml.jackson.core:jackson-core:${jacksonCoreVersion}"
            force "com.fasterxml.jackson.dataformat:jackson-dataformat-jsonpath:${jacksonDatabindVersion}" // 与jackson-databind版本一致
            force "com.fasterxml.jackson.core:jackson-annotations:${jacksonDatabindVersion}"
            force "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonDatabindVersion}" // 补充Jackson时间模块强制

            // Spring 核心安全版本
            force "org.springframework:spring-webmvc:6.1.21"
            force "org.springframework:spring-webflux:6.1.21"
            force "org.springframework:spring-context:6.1.21"
            force "org.springframework:spring-beans:6.1.21"
            force "org.springframework:spring-aop:6.1.21"
            force "org.springframework:spring-expression:6.1.21"
            force "org.springframework:spring-tx:6.1.21"
            force "org.springframework:spring-jdbc:6.1.21"
            force "org.springframework:spring-web:6.1.21"

            // HTTP 客户端
            force "org.apache.httpcomponents:httpclient:${httpclientVersion}" // 4.5.14（文档1已定义，修复CVE-2020-13956）

            force "org.apache.parquet:parquet-avro:${parquetAvroVersion}"
            force "com.squareup.okio:okio:${okioVersion}"
            force "com.azure:azure-identity:${azureIdentityVersion}"
            force "com.google.guava:guava:${guavaVersion}"
            force "org.apache.avro:avro:${avroVersion}"
            force "org.bouncycastle:bcprov-jdk18on:${bcprovjdk15onVersion}"
            force "org.apache.tomcat.embed:tomcat-embed-core:${tomcatEmbedVersion}"
            force "org.apache.kafka:kafka-clients:3.9.1"

            force "com.jayway.jsonpath:json-path:${jsonPathVersion}" // 2.9.0（文档1已定义，修复堆栈溢出漏洞）
            force "com.squareup.retrofit2:converter-jackson:3.0.0"
            force "com.squareup.okhttp3:okhttp:4.12.0"
            force "org.springframework.boot:spring-boot-starter-test:3.5.11"
            force "org.springframework.cloud:spring-cloud-openfeign-core:4.1.5"
            force "org.springframework.cloud:spring-boot-starter-webflux:3.3.13"
//            force "org.springframework.cloud:spring-boot-starter-web:3.3.13"
            force "org.springframework.boot:spring-boot-starter:3.3.13"
            force "org.yaml:snakeyaml:2.5"
            force "org.springframework:spring-core:6.1.21"
            force 'org.eclipse.jgit:org.eclipse.jgit:7.4.0.202509020913-r'

            force "org.springframework.boot:spring-boot-autoconfigure:4.0.0-M3"
//            force 'org.springframework.cloud:spring-cloud-config-server:5.0.0-M4'
            force 'org.springframework.cloud:spring-cloud-config-server:5.0.2'

            force "io.netty:netty-common:${nettyVersion}"
            force "io.netty:netty-handler:${nettyVersion}"
            force "io.netty:netty-codec:${nettyVersion}"
            force "io.netty:netty-codec-http:${nettyVersion}"
            force "io.netty:netty-codec-http2:${nettyVersion}"
            force "io.netty:netty-transport:${nettyVersion}"
            force "io.netty:netty-buffer:${nettyVersion}"
            force "io.netty:netty-resolver:${nettyVersion}"

            force "commons-io:commons-io:2.16.1"
            force "org.apache.commons:commons-compress:1.28.0"
            force "org.apache.commons:commons-collections4:4.4"
            force "org.springframework.security:spring-security-rsa:1.1.5"
            force "org.cryptacular:cryptacular:1.2.7"
//            force "com.alibaba.cloud:spring-alibaba-nacos-config:2023.0.0.0-RC1"
//            force "com.alibaba.cloud:spring-cloud-alibaba-commons:2023.0.0.0-RC1"

            // 3. 排除无业务依赖的高危组件
            exclude group: 'io.airlift', module: 'aircompressor'
            // 优化组件排除策略
            exclude group: 'io.github.classgraph', module: 'classgraph'
            exclude group: 'commons-beanutils', module: 'commons-beanutils'
            exclude group: 'com.fasterxml.woodstox', module: 'woodstox-core'
            exclude group: 'com.oracle.oci', module: 'oci-java-sdk-common'
            exclude group: 'org.ini4j', module: 'ini4j'
            // 添加新的高危组件排除
            exclude group: 'xerces', module: 'xercesImpl'
            exclude group: 'xalan', module: 'xalan'
            exclude group: 'xml-apis', module: 'xml-apis'
            exclude group: 'org.ow2.asm', module: 'asm' // 使用安全版本替代
            exclude group: 'org.eclipse.jgit', module: 'org.eclipse.jgit' // 使用安全版本替代
            exclude group: 'com.alibaba.nacos', module: 'nacos-api'
            exclude group: "org.springframework.cloud", module: "spring-cloud-config-server"
        }
    }

}


