apply plugin: 'java-library'

group = 'voc-service-common-redis'
version = "2.0.0-SNAPSHOT"

dependencies {
    api project(':voc-service-common')

    api('org.springframework.boot:spring-boot-starter-data-redis')
    runtimeOnly 'org.springframework.integration:spring-integration-redis'
    api 'org.apache.commons:commons-pool2'
    api 'org.redisson:redisson'
    api 'com.alicp.jetcache:jetcache-starter-redis'
    api 'com.alicp.jetcache:jetcache-starter-redis-lettuce'
    api 'javax.annotation:javax.annotation-api:1.3.2'
    api 'cn.hutool:hutool-all'

    // 添加缺失的依赖项
//    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer:4.1.0'
}