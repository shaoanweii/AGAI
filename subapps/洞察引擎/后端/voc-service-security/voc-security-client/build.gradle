apply plugin: 'java-library'

group = 'voc-service-common'
version = "2.0.0-SNAPSHOT"

dependencies {
    testImplementation  project(':voc-service-common').sourceSets.test.output
    api project(':voc-service-common')
    api project(':voc-service-security:voc-security-api')
//    api project(':voc-service-ops:voc-ops-api')
    api project(':voc-service-components:voc-cmps-redis')

//    compileOnly 'com.alipay.sofa:rpc-sofa-boot-starter'
    compileOnly('org.springframework.boot:spring-boot-starter-web')
//    api('org.springframework.boot:spring-boot-starter-security')
//    api('org.springframework.boot:spring-boot-starter-webflux')
//    api('org.springframework.boot:spring-boot-starter-oauth2-client')
//    api('org.springframework.boot:spring-boot-starter-oauth2-resource-server')
    api('org.springframework.cloud:spring-cloud-starter-openfeign') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }


    api 'javax.annotation:javax.annotation-api:1.3.2'
}
