apply plugin: 'java-library'

group = 'voc-service-common'
version = "2.0.0-SNAPSHOT"

// 禁用Spring Boot插件，因为这是一个库模块，不是可执行的应用程序
// 只有应用程序模块才需要Spring Boot插件

// 为根项目禁用Spring Boot插件的bootJar任务

dependencies {

    api("org.springframework.boot:spring-boot-starter-web") {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jdbc'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    compileOnly("org.springframework.boot:spring-boot-starter-security") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    }
    compileOnly('org.springframework.boot:spring-boot-starter-data-redis')
    api('com.github.pagehelper:pagehelper-spring-boot-starter')
    api('com.baomidou:mybatis-plus-boot-starter') {
//        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jdbc'
    }
    api("com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.5.0")
    api 'cn.hutool:hutool-all'
    api 'com.auth0:java-jwt:4.4.0'
//    api 'javax.servlet:javax.servlet-api'
    api 'jakarta.servlet:jakarta.servlet-api'
    api 'org.bouncycastle:bcprov-jdk18on'
    api 'org.mapstruct:mapstruct'
    api 'org.mapstruct:mapstruct-processor'
    api 'com.esotericsoftware.kryo:kryo5'
    api 'org.aspectj:aspectjweaver'
//    api 'org.apache.flink:flink-shaded-guava:33.4.0-jre-20.0'
    api 'io.micrometer:micrometer-registry-prometheus'
//    api 'com.fasterxml.jackson.core:jackson-databind'
//    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    api 'org.passay:passay'
    api 'com.github.ben-manes.caffeine:caffeine'
    /*api ('com.alibaba.nacos:logback-adapter'){
        exclude group: 'com.alibaba.nacos', module: 'nacos-common'
    }
    api 'ch.qos.logback:logback-classic'*/

    api 'org.springframework.cloud:spring-cloud-starter-openfeign:5.0.0-M4'
//    api 'org.springframework.cloud:spring-cloud-starter-loadbalancer:4.0.0'
    api 'io.github.openfeign:feign-httpclient'
    api 'io.github.openfeign:feign-okhttp'
    api 'io.github.openfeign:feign-hc5'
//    api("org.springframework.boot:spring-boot-starter-actuator:3.3.13")
    api("org.springframework.boot:spring-boot-starter-actuator:3.5.12")
    api("org.apache.skywalking:apm-toolkit-logback-1.x:9.4.0")
    api("org.apache.skywalking:apm-toolkit-trace:9.4.0")
//    api ("com.github.timpeeters:spring-boot-graceful-shutdown:2.2.2"){
//        exclude group: ' org.springframework', module: 'spring-core'
//    }
    api "com.alibaba:transmittable-thread-local:2.14.5"
    api "com.googlecode.aviator:aviator"
    api('com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel') {
        exclude group: 'com.alibaba', module: 'fastjson'
//        exclude group: 'com.alibaba.csp', module: 'sentinel-spring-webflux-adapter'
//        exclude group: 'com.alibaba.csp', module: 'sentinel-spring-webmvc-6x-adapter'
    }
//    api 'com.alibaba.csp:sentinel-datasource-nacos'
    api 'com.alibaba.csp:sentinel-transport-simple-http'
    api 'com.alibaba.csp:sentinel-core'
    api 'io.micrometer:micrometer-registry-prometheus'
    api 'de.codecentric:spring-boot-admin-starter-client'
    api('com.alibaba:easyexcel')
    implementation 'com.belerweb:pinyin4j:2.5.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // 添加缺失的依赖项
//    implementation 'io.prometheus:simpleclient_common:0.15.0'
//    implementation 'org.jspecify:jspecify:0.2.0'
//    api 'com.alipay.sofa:runtime-sofa-boot-starter'
}