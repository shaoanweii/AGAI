    .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }

          "value2": 5564
      }

  // 展示顺序（动态推导：按数据首次出现的顺序）
  const brandOrder = Array.from(new Set(rows.map(r => r.brandName)));
  const tag1Order = Array.from(new Set(rows.map(r => r.tag1Name)));

  // 获取各一级标签下的二级标签集合（按出现顺序去重）
  const tag2UnderTag1 = new Map();
  for (const t1 of tag1Order) tag2UnderTag1.set(t1, []);
  for (const r of rows) {
    const list = tag2UnderTag1.get(r.tag1Name) || [];
    if (!list.includes(r.tag2Name)) list.push(r.tag2Name);
    tag2UnderTag1.set(r.tag1Name, list);
  }

  // 预聚合：按 brand + tag1 + tag2Name 合并（value1 取均值，value2 求和）
  const agg = {}; // key: brand|tag1|tag2Name
  for (const r of rows) {
    const k = `${r.brandName}|${r.tag1Name}|${r.tag2Name}`;
    if (!agg[k]) agg[k] = {sumV1:0, cntV1:0, sumV2:0};
    agg[k].sumV1 += Number(r.value1)||0; agg[k].cntV1 += 1; agg[k].sumV2 += Number(r.value2)||0;
  }
  const getAgg = (brand, t1, t2) => {
    const a = agg[`${brand}|${t1}|${t2}`];
    if (!a) return {v1: null, v2: null};
    return {v1: a.cntV1 ? (a.sumV1/a.cntV1) : null, v2: a.sumV2};
  };

  // 渲染表
  const table = document.getElementById('matrix');

  // 构建表头
  const thead = document.createElement('thead');
  const tr1 = document.createElement('tr');
  const thBrand = document.createElement('th'); thBrand.textContent = '品牌'; thBrand.className='w-brand'; thBrand.rowSpan = 2; tr1.appendChild(thBrand);
  const thMetric = document.createElement('th'); thMetric.textContent = '指标'; thMetric.className='w-metric'; thMetric.rowSpan = 2; tr1.appendChild(thMetric);
  for (const t1 of tag1Order) {
    const t2s = tag2UnderTag1.get(t1) || [];
    if (t2s.length === 0) continue;
    const th = document.createElement('th'); th.textContent = t1; th.colSpan = t2s.length; th.className='tag1'; tr1.appendChild(th);
  }
  thead.appendChild(tr1);

  const tr2 = document.createElement('tr');
  for (const t1 of tag1Order) {
    const t2s = tag2UnderTag1.get(t1) || [];
    for (const t2 of t2s) {
      const th = document.createElement('th'); th.textContent = t2; tr2.appendChild(th);
    }
  }
  thead.appendChild(tr2);
  table.appendChild(thead);

  // 构建表体
  const tbody = document.createElement('tbody');
  const formatPct = v => (v==null || Number.isNaN(v)) ? '-' : (Math.round(v*100)/100).toFixed(2) + '%';
  const formatNum = v => (v==null || Number.isNaN(v)) ? '-' : String(v);
  const hot = (v) => v!=null && v >= 34.0; // 简单示例：>=34% 高亮

  for (const brand of brandOrder) {
    // 第一行：负面率
    const trRate = document.createElement('tr');
    const tdBrand = document.createElement('td'); tdBrand.textContent = brand; tdBrand.rowSpan = 2; trRate.appendChild(tdBrand);
    const tdMetric1 = document.createElement('td'); tdMetric1.textContent = '负面率'; trRate.appendChild(tdMetric1);

    for (const t1 of tag1Order) {
      const t2s = tag2UnderTag1.get(t1) || [];
      for (const t2 of t2s) {
        const {v1} = getAgg(brand, t1, t2);
        const td = document.createElement('td');
        td.className = 'percent' + (hot(v1) ? ' hot' : '');
        td.textContent = formatPct(v1);
        trRate.appendChild(td);
      }
    }
    tbody.appendChild(trRate);

    // 第二行：提及量
    const trMentions = document.createElement('tr');
    const tdMetric2 = document.createElement('td'); tdMetric2.textContent = '提及量'; trMentions.appendChild(tdMetric2);
    for (const t1 of tag1Order) {
      const t2s = tag2UnderTag1.get(t1) || [];
      for (const t2 of t2s) {
        const {v2} = getAgg(brand, t1, t2);
        const td = document.createElement('td');
        td.textContent = formatNum(v2);
        trMentions.appendChild(td);
      }
    }
    tbody.appendChild(trMentions);
  }
