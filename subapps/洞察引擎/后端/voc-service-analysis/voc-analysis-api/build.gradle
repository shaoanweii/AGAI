apply plugin: 'java-library'
apply plugin: 'kotlin'

group = 'voc-analysis-api'
version = "2.0.0-SNAPSHOT"

dependencies {
    api project(':voc-service-common')
    api project(':voc-service-insights:voc-insights-api')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
repositories {
    mavenCentral()
}
kotlin {
    jvmToolchain(17)
}
