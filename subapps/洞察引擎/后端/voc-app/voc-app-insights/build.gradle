apply plugin: 'java-library'

group = 'voc-app-insights'
version = "1.0.0-SNAPSHOT"

dependencies {

    api project (':voc-service-insights:voc-insights-api')
    api project (':voc-service-insights:voc-insights-data-impl')
    api project (':voc-service-insights:voc-insights-model-impl')
    api project (':voc-service-insights:voc-insights-impl')
    api project (':voc-service-insights:voc-insights-alert-impl')
    api project (':voc-service-third:voc-trhird-feishu-impl')
    api project (':voc-service-insights:voc-insights-risk')
    api project (':voc-service-bizlogs:voc-bizlogs-api')
    api project (':voc-service-bizlogs:voc-bizlogs-impl')


}


tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"

    jar {
        String someString = ''
//        configurations.runtimeClasspath.each { someString = someString + " lib//" + it.name }

        fileTree("$buildDir/libs/lib-voc").each { someString = someString + " lib-voc//" + it.name }
        fileTree("$buildDir/libs/lib").each { someString = someString + " lib//" + it.name }

        manifest {
            attributes "Manifest-Version": 1.0
            attributes "jdk": sourceCompatibility
            attributes 'Main-Class': 'com.voc.VocInsightsApplication'
            attributes 'Class-Path': someString
        }
    }
}