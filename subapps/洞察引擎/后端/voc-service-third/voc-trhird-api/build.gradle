apply plugin: 'java-library'

group = 'voc-service-third-api'
version = "2.0.0-SNAPSHOT"

dependencies {

    api project(':voc-service-common')
    implementation ('cn.bigmodel.openapi:oapi-java-sdk:release-V4-2.3.0'){
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.squareup.okio', module: 'okio'
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation 'com.google.code.gson:gson'
    //    api 'jakarta.servlet:jakarta.servlet-api'

    // 添加缺失的依赖项
//    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer:4.1.0'
//    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
//    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}