<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGAI Logo Concept V1</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b1020;
      }

      body {
        display: grid;
        place-items: center;
      }

      .stage {
        display: grid;
        width: 640px;
        height: 640px;
        place-items: center;
        background: radial-gradient(circle at center, #16213f 0, #0b1020 68%);
      }

      img {
        width: 512px;
        height: 512px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img src="/agai-logo-concept-v1.svg" alt="AGAI Logo Concept V1" />
    </div>
  </body>
</html>
